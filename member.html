<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <title>회원 상세 정보</title>
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <script>if (sessionStorage.getItem("admin") !== "1") location.href = "admin.html";</script>
    <link href="https://fonts.googleapis.com/css2?family=Noto+Sans+KR:wght@400;500;700&display=swap" rel="stylesheet">
    <style>
        :root { 
            --bg: #0b0f1a; 
            --card-bg: #161e2d; 
            --primary: #10b981; 
            --danger: #f43f5e; 
            --text-main: #f1f5f9; 
            --text-sub: #94a3b8; 
            --glass-border: rgba(255, 255, 255, 0.08);
        }

        body { 
            font-family: 'Pretendard', sans-serif; 
            background: var(--bg); 
            color: var(--text-main); 
            margin: 0; 
            padding: 20px;
            background-image: radial-gradient(circle at 50% -20%, #1e293b 0%, var(--bg) 80%);
        }

        .container { max-width: 500px; margin: 0 auto; }
        #mainProgressBar { position: fixed; top: 0; left: 0; width: 0%; height: 4px; background: var(--primary); transition: width 0.3s; z-index: 1000; }

        header { display: flex; justify-content: space-between; align-items: center; margin-bottom: 25px; }
        header h2 { margin: 0; font-size: 1.4rem; font-weight: 800; }
        
        /* 목록으로 버튼 효과 */
        .back-link { 
            color: var(--text-sub); 
            text-decoration: none; 
            font-size: 0.85rem; 
            padding: 8px 16px; 
            border-radius: 12px; 
            border: 1px solid var(--glass-border); 
            background: rgba(255,255,255,0.03); 
            transition: all 0.3s ease; 
        }
        .back-link:hover {
            background: rgba(255,255,255,0.1);
            color: #fff;
            transform: translateY(-2px);
            border-color: var(--text-sub);
        }

        .info-card { 
            background: var(--card-bg); 
            border-radius: 24px; 
            padding: 25px; 
            border: 1px solid var(--glass-border); 
            box-shadow: 0 10px 25px -5px rgba(0,0,0,0.3);
        }

        .info-row { margin-bottom: 20px; }
        .label { font-size: 0.85rem; color: var(--text-sub); display: block; margin-bottom: 8px; font-weight: 500; }
        .value { font-size: 1.1rem; font-weight: 600; color: var(--text-main); }
        
        .edit-input { 
            width: 100%; padding: 12px; border-radius: 12px; 
            border: 1px solid var(--glass-border); background: #0b0f1a; 
            color: white; display: none; margin-top: 5px; box-sizing: border-box; 
            font-family: inherit; font-size: 1rem; outline: none;
        }
        .edit-input:focus { border-color: var(--primary); }

        .btn-group { display: flex; gap: 10px; margin-top: 30px; }
        
        /* 버튼 공통 스타일 */
        .btn { 
            flex: 1; padding: 16px; border-radius: 16px; border: none; 
            font-weight: 700; font-size: 0.95rem; cursor: pointer; 
            transition: all 0.3s cubic-bezier(0.4, 0, 0.2, 1); 
            display: flex; align-items: center; justify-content: center;
        }

        /* 수정하기 버튼 */
        .btn-edit { 
            background: var(--primary); 
            color: #064e3b; 
            box-shadow: 0 4px 12px rgba(16, 185, 129, 0.2);
        }
        .btn-edit:hover {
            transform: translateY(-3px);
            filter: brightness(1.1);
            box-shadow: 0 8px 20px rgba(16, 185, 129, 0.3);
        }

        /* 저장하기 버튼 */
        .btn-save { 
            background: #3b82f6; 
            color: #fff; 
            display: none; 
            box-shadow: 0 4px 12px rgba(59, 130, 246, 0.2);
        }
        .btn-save:hover {
            transform: translateY(-3px);
            filter: brightness(1.1);
            box-shadow: 0 8px 20px rgba(59, 130, 246, 0.3);
        }

        /* 회원 삭제 버튼 */
        .btn-del { 
            background: rgba(244, 63, 94, 0.08); 
            color: var(--danger); 
            border: 1px solid rgba(244, 63, 94, 0.2); 
        }
        .btn-del:hover {
            background: var(--danger);
            color: #fff;
            transform: translateY(-3px);
            box-shadow: 0 8px 20px rgba(244, 63, 94, 0.3);
        }

        .btn:active { transform: scale(0.96) translateY(0); }

        #view_phone_link { border-bottom: 1px dashed var(--text-sub); padding-bottom: 2px; }
    </style>
</head>
<body>
    <div id="mainProgressBar"></div>
    <div class="container">
        <header>
            <h2 id="headerName">회원 상세</h2>
            <a href="index.html" class="back-link">목록으로</a>
        </header>

        <div class="info-card">
            <div class="info-row">
                <span class="label">이름</span>
                <div class="value" id="view_name">-</div>
                <input type="text" id="edit_name" class="edit-input">
            </div>

            <div class="info-row">
                <span class="label">담당 선생님</span>
                <div class="value" id="view_teacher">-</div>
                <input type="text" id="edit_teacher" class="edit-input">
            </div>
            
            <div class="info-row">
                <span class="label">연락처 (터치 시 통화)</span>
                <div class="value">
                    <a id="view_phone_link" href="#" style="color:inherit; text-decoration:none;">-</a>
                </div>
                <input type="tel" id="edit_phone" class="edit-input">
            </div>

            <div class="info-row">
                <span class="label">운동 목적</span>
                <div class="value" id="view_goal">-</div>
                <select id="edit_goal" class="edit-input">
                    <option value="다이어트">🔥 다이어트</option>
                    <option value="근력 향상">💪 근력 향상</option>
                    <option value="체형 교정">🧘 체형 교정</option>
                    <option value="바디 프로필">📸 바디 프로필</option>
                    <option value="재활 및 통증 완화">🏥 재활 및 통증 완화</option>
                    <option value="기타">✏️ 기타</option>
                </select>
            </div>

            <div class="info-row">
                <span class="label">잔여 PT</span>
                <div class="value" id="view_pt">-</div>
                <input type="number" id="edit_pt" class="edit-input">
            </div>
            
            <div class="info-row">
                <span class="label">신체 정보 (cm/kg)</span>
                <div class="value" id="view_body">-</div>
                <div id="edit_body_group" style="display:none; gap:10px; margin-top:5px;">
                    <input type="number" id="edit_height" class="edit-input" placeholder="키" style="display:block; flex:1;">
                    <input type="number" id="edit_weight" class="edit-input" placeholder="몸무게" style="display:block; flex:1;">
                </div>
            </div>

            <div class="info-row">
                <span class="label">주소</span>
                <div class="value" id="view_address">-</div>
                <input type="text" id="edit_address" class="edit-input">
            </div>

            <div class="info-row">
                <span class="label">메모</span>
                <div class="value" id="view_memo" style="white-space:pre-wrap;">-</div>
                <textarea id="edit_memo" class="edit-input" rows="4" style="resize:none;"></textarea>
            </div>

            <div class="btn-group">
                <button class="btn btn-edit" id="btnEdit" onclick="toggleEdit()">수정하기</button>
                <button class="btn btn-save" id="btnSave" onclick="save()">저장하기</button>
                <button class="btn btn-del" id="btnDelete" onclick="askDelete()">회원 삭제</button>
            </div>
        </div>
    </div>

    <script>
        const API = "https://script.google.com/macros/s/AKfycby80GPaE8yuwvk8CE6Jq935bZL3PVwvg7a_gChDwW9JYC1YAEPsqiTf4yRxBlsIbKe8/exec";
        const urlParams = new URLSearchParams(window.location.search);
        const memberId = urlParams.get('id');

        async function load() {
            const bar = document.getElementById('mainProgressBar');
            bar.style.width = "40%";
            try {
                const res = await fetch(`${API}?action=members`);
                const json = await res.json();
                const m = json.data.find(i => String(i.id) === String(memberId));
                if (m) {
                    document.getElementById('headerName').innerText = `${m.name} 회원님`;
                    document.getElementById('view_name').innerText = m.name;
                    document.getElementById('edit_name').value = m.name;

                    document.getElementById('view_teacher').innerText = m.teacher || "미지정";
                    document.getElementById('edit_teacher').value = m.teacher || "";
                    
                    const phoneLink = document.getElementById('view_phone_link');
                    phoneLink.innerText = m.phone;
                    phoneLink.href = `tel:${m.phone}`;
                    document.getElementById('edit_phone').value = m.phone;

                    document.getElementById('view_goal').innerText = m.goal || "미설정";
                    document.getElementById('edit_goal').value = m.goal || "다이어트";

                    document.getElementById('view_pt').innerText = `${m.pt}회`;
                    document.getElementById('edit_pt').value = m.pt;

                    document.getElementById('view_body').innerText = `${m.height || 0}cm / ${m.weight || 0}kg`;
                    document.getElementById('edit_height').value = m.height || "";
                    document.getElementById('edit_weight').value = m.weight || "";

                    document.getElementById('view_address').innerText = m.address || "-";
                    document.getElementById('edit_address').value = m.address || "";

                    document.getElementById('view_memo').innerText = m.memo || "내용 없음";
                    document.getElementById('edit_memo').value = m.memo || "";
                }
                bar.style.width = "100%";
                setTimeout(() => bar.style.width = "0", 500);
            } catch (e) { alert("정보 로드 실패"); }
        }

        function toggleEdit() {
            const isEditing = document.getElementById('btnSave').style.display === 'flex';
            document.querySelectorAll('.value').forEach(v => v.style.display = isEditing ? 'block' : 'none');
            document.querySelectorAll('.edit-input').forEach(e => e.style.display = isEditing ? 'none' : 'block');
            
            // 신체 정보 그룹 특수 처리
            document.getElementById('edit_body_group').style.display = isEditing ? 'none' : 'flex';

            document.getElementById('btnEdit').style.display = isEditing ? 'flex' : 'none';
            document.getElementById('btnSave').style.display = isEditing ? 'none' : 'flex';
            document.getElementById('btnDelete').style.display = isEditing ? 'flex' : 'none';
        }

        async function save() {
            const btn = document.getElementById('btnSave');
            btn.disabled = true;
            btn.innerText = "저장 중...";
            const payload = {
                action: "updateDetails",
                memberId: memberId,
                name: document.getElementById('edit_name').value,
                teacher: document.getElementById('edit_teacher').value,
                phone: document.getElementById('edit_phone').value,
                goal: document.getElementById('edit_goal').value,
                pt: document.getElementById('edit_pt').value,
                height: document.getElementById('edit_height').value,
                weight: document.getElementById('edit_weight').value,
                address: document.getElementById('edit_address').value,
                memo: document.getElementById('edit_memo').value
            };
            try {
                const res = await fetch(API, { method: 'POST', body: JSON.stringify(payload) });
                const result = await res.json();
                if(result.result === "success") {
                    alert("성공적으로 수정되었습니다.");
                    location.reload();
                } else {
                    alert("저장 실패: " + result.message);
                    btn.disabled = false;
                    btn.innerText = "저장하기";
                }
            } catch (e) { alert("서버 통신 오류"); btn.disabled = false; btn.innerText = "저장하기"; }
        }

        async function askDelete() {
            if(confirm("정말 이 회원을 삭제하시겠습니까?")) {
                const res = await fetch(API, { method: 'POST', body: JSON.stringify({ action: "deleteMember", memberId }) });
                if((await res.json()).result === "success") {
                    alert("삭제되었습니다.");
                    location.href = "index.html";
                }
            }
        }
        if (memberId) load();
    </script>
</body>
</html>

<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <title>회원 상세 정보</title>
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <script>
        if (sessionStorage.getItem("admin") !== "1") location.href = "admin.html";
    </script>
    <link href="https://fonts.googleapis.com/css2?family=Pretendard:wght@400;600;700&display=swap" rel="stylesheet">
    <style>
        :root {
            --bg: #0f172a;
            --card-bg: #1e293b;
            --primary: #22c55e;
            --danger: #ef4444;
            --text-main: #f8fafc;
            --text-sub: #94a3b8;
        }
        body { font-family: 'Pretendard', sans-serif; background: var(--bg); color: var(--text-main); margin: 0; padding: 20px; }
        .container { max-width: 500px; margin: 0 auto; }
        
        /* 상단 로딩 프로그레스 바 */
        #mainLoaderContainer { position: fixed; top: 0; left: 0; width: 100%; height: 4px; background: rgba(255,255,255,0.05); z-index: 1000; }
        #mainProgressBar { width: 0%; height: 100%; background: linear-gradient(90deg, #4ade80, #22c55e); transition: width 0.3s ease; box-shadow: 0 0 10px var(--primary); }

        header { display: flex; justify-content: space-between; align-items: center; margin-bottom: 30px; }
        h2 { font-size: 1.3rem; margin: 0; font-weight: 700; color: var(--primary); }
        .btn-back { background: rgba(255,255,255,0.05); border: 1px solid rgba(255,255,255,0.1); color: white; padding: 8px 16px; border-radius: 12px; cursor: pointer; }

        .card { background: var(--card-bg); border-radius: 24px; padding: 24px; border: 1px solid rgba(255,255,255,0.05); margin-bottom: 20px; animation: fadeIn 0.5s ease forwards; opacity: 0; }
        @keyframes fadeIn { from { opacity: 0; transform: translateY(10px); } to { opacity: 1; transform: translateY(0); } }

        h3 { font-size: 1rem; margin: 0 0 20px 0; color: var(--text-sub); display: flex; align-items: center; gap: 8px; }
        h3::before { content: ''; width: 4px; height: 16px; background: var(--primary); border-radius: 10px; }

        .info-row { display: flex; justify-content: space-between; padding: 12px 0; border-bottom: 1px solid rgba(255,255,255,0.05); }
        .info-row.column { flex-direction: column; gap: 8px; } /* 주소처럼 긴 항목용 */
        .label { color: var(--text-sub); font-size: 0.9rem; }
        .value { font-weight: 600; }

        .btn-delete { width: 100%; background: none; color: var(--danger); border: 1px solid var(--danger); padding: 12px; border-radius: 15px; font-weight: 600; cursor: pointer; margin-top: 20px; opacity: 0.7; }
    </style>
</head>
<body>
    <div id="mainLoaderContainer"><div id="mainProgressBar"></div></div>

    <div class="container">
        <header>
            <h2>회원 상세 프로필</h2>
            <button class="btn-back" onclick="location.href='index.html'">← 목록</button>
        </header>

        <div class="card" style="animation-delay: 0.1s;">
            <h3>기본 정보</h3>
            <div class="info-row"><span class="label">이름</span><span class="value" id="name">-</span></div>
            <div class="info-row"><span class="label">연락처</span><span class="value" id="phone">-</span></div>
            <div class="info-row column">
                <span class="label">주소</span>
                <span class="value" id="address" style="font-weight: 400; color: #cbd5e1;">-</span>
            </div>
            <div class="info-row">
                <span class="label">잔여 수업</span>
                <span id="ptView" class="value" style="color:var(--primary); font-size: 1.1rem;">-</span>
            </div>
        </div>

        <div class="card" style="animation-delay: 0.2s;">
            <h3>PT 상세 및 메모</h3>
            <div class="info-row">
                <span class="label">신체 정보</span>
                <span id="bodyView" class="value">-</span>
            </div>
            <div style="margin-top:20px;">
                <div class="label" style="margin-bottom:10px;">관리 메모</div>
                <div id="memoView" style="background: rgba(0,0,0,0.2); padding: 15px; border-radius: 15px; font-size: 0.95rem; color: #cbd5e1; border: 1px solid rgba(255,255,255,0.05); min-height: 80px; white-space: pre-wrap;">-</div>
            </div>
        </div>

        <button class="btn-delete" onclick="askDelete()">회원 정보 삭제</button>
    </div>

    <script>
        const API = "https://script.google.com/macros/s/AKfycbyDxpufb43p7KP9LrrANZm4wFnyHFiMuKrJu9fjnsBA6kcbXu-QKvK3-VydebDBZXKK/exec"; 
        const memberId = new URLSearchParams(window.location.search).get('id');

        async function load() {
            const bar = document.getElementById('mainProgressBar');
            try {
                bar.style.width = "40%";
                const res = await fetch(`${API}?action=members`);
                const json = await res.json();
                bar.style.width = "80%";
                
                const m = json.data.find(i => String(i.id) === String(memberId));
                
                if (m) {
                    document.getElementById('name').innerText = m.name;
                    document.getElementById('phone').innerText = m.phone;
                    // 주소 데이터 연결 (m.address)
                    document.getElementById('address').innerText = m.address || "등록된 주소 없음";
                    document.getElementById('ptView').innerText = m.pt + "회 남음";
                    document.getElementById('bodyView').innerText = `${m.height || 0}cm / ${m.weight || 0}kg`;
                    document.getElementById('memoView').innerText = m.memo || "내용 없음";
                }
                
                bar.style.width = "100%";
                setTimeout(() => { bar.style.width = "0%"; }, 500);
            } catch (e) {
                alert("정보를 불러오는데 실패했습니다.");
            }
        }

        async function askDelete() {
            if(confirm("정말 삭제하시겠습니까?")) {
                const res = await fetch(API, { method: 'POST', body: JSON.stringify({ action: "deleteMember", memberId }) });
                const result = await res.json();
                if(result.result === "success") { alert("삭제되었습니다."); location.href="index.html"; }
            }
        }

        if (memberId) load();
    </script>
</body>
</html>

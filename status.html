<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <title>PT 잔여 리포트</title>
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <script>if (sessionStorage.getItem("admin") !== "1") location.href = "admin.html";</script>
    <link href="https://fonts.googleapis.com/css2?family=Pretendard:wght@400;600;700&display=swap" rel="stylesheet">
    <style>
        :root {
            --bg: #0f172a;
            --card-bg: #1e293b;
            --primary: #22c55e;
            --danger: #ef4444;
            --text-main: #f8fafc;
            --text-sub: #94a3b8;
        }

        body { font-family: 'Pretendard', sans-serif; background: var(--bg); color: var(--text-main); margin: 0; padding: 15px; }
        .container { width: 100%; max-width: 500px; margin: 0 auto; }
        
        header { margin-bottom: 20px; display: flex; justify-content: space-between; align-items: center; }
        h2 { font-size: 1.2rem; font-weight: 700; margin: 0; }
        .back-link { color: var(--text-sub); text-decoration: none; font-size: 0.9rem; border: 1px solid #334155; padding: 5px 12px; border-radius: 8px; }

        #mainProgressBar { position: fixed; top: 0; left: 0; width: 0%; height: 3px; background: var(--primary); transition: width 0.3s; z-index: 1000; }

        /* 2열 그리드 레이아웃 */
        .grid-container { 
            display: grid; 
            grid-template-columns: 1fr 1fr; 
            gap: 10px; 
        }

        .member-card { 
            background: var(--card-bg); 
            border-radius: 12px; 
            padding: 12px; 
            border: 1px solid rgba(255,255,255,0.05);
            display: flex;
            flex-direction: column;
            justify-content: space-between;
        }

        .card-header { display: flex; justify-content: space-between; align-items: flex-start; margin-bottom: 8px; }
        .name { font-weight: 700; font-size: 0.9rem; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; max-width: 70%; }
        .count { font-size: 0.9rem; font-weight: 800; color: #4ade80; }
        .low-text { color: var(--danger) !important; }

        .teacher-info { font-size: 0.75rem; color: var(--text-sub); margin-bottom: 10px; }
        
        /* 미니 프로그레스 바 */
        .prog-track { width: 100%; height: 4px; background: rgba(255,255,255,0.1); border-radius: 2px; overflow: hidden; }
        .prog-fill { height: 100%; background: var(--primary); transition: width 0.8s ease-out; }
        .low-fill { background: var(--danger) !important; }

        .alert-dot { width: 6px; height: 6px; background: var(--danger); border-radius: 50%; display: inline-block; margin-right: 4px; }

    </style>
</head>
<body>
    <div id="mainProgressBar"></div>
    <div class="container">
        <header>
            <h2>PT 잔여 리포트</h2>
            <a href="index.html" class="back-link">닫기</a>
        </header>
        <div id="reportGrid" class="grid-container"></div>
    </div>

    <script>
        const API = "https://script.google.com/macros/s/AKfycbwUU5njs_p4VY0gVVLw2b1ISQp9tSX_0AlQPz9FkQAqn73hMqEDQcAfvmP20lCUw6k9/exec";

        async function loadReport() {
            const bar = document.getElementById('mainProgressBar');
            bar.style.width = "30%";
            try {
                const res = await fetch(`${API}?action=members`);
                const json = await res.json();
                const members = json.data;
                
                // 잔여 횟수 적은 순으로 정렬
                members.sort((a, b) => Number(a.pt) - Number(b.pt));

                const grid = document.getElementById('reportGrid');
                grid.innerHTML = "";
                bar.style.width = "70%";

                members.forEach(m => {
                    const pt = Number(m.pt || 0);
                    const isLow = pt <= 3;
                    const maxPT = 30; 
                    const percent = Math.min((pt / maxPT) * 100, 100);

                    const card = document.createElement('div');
                    card.className = 'member-card';
                    card.innerHTML = `
                        <div>
                            <div class="card-header">
                                <span class="name">${isLow ? '<span class="alert-dot"></span>' : ''}${m.name}</span>
                                <span class="count ${isLow ? 'low-text' : ''}">${pt}회</span>
                            </div>
                            <div class="teacher-info">${m.teacher || '담당무'}T</div>
                        </div>
                        <div class="prog-track">
                            <div class="prog-fill ${isLow ? 'low-fill' : ''}" style="width: 0%"></div>
                        </div>
                    `;
                    grid.appendChild(card);

                    setTimeout(() => {
                        card.querySelector('.prog-fill').style.width = percent + "%";
                    }, 150);
                });

                bar.style.width = "100%";
                setTimeout(() => { bar.style.width = "0"; }, 500);

            } catch (e) {
                alert("데이터 로드 실패");
            }
        }

        loadReport();
    </script>
</body>
</html>

<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <title>PT 잔여 수업 리포트</title>
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <script>
        if (sessionStorage.getItem("admin") !== "1") location.href = "admin.html";
    </script>
    <link href="https://fonts.googleapis.com/css2?family=Pretendard:wght@400;600;700&display=swap" rel="stylesheet">
    <style>
        :root {
            --bg: #0f172a; /* 짙은 네이비 배경 */
            --card-bg: #1e293b;
            --primary: #22c55e; /* 선명한 초록 */
            --danger: #ef4444; /* 선명한 빨강 */
            --text-main: #f8fafc;
            --text-sub: #94a3b8;
        }

        body {
            font-family: 'Pretendard', sans-serif;
            background: var(--bg);
            color: var(--text-main);
            margin: 0;
            padding: 20px;
            display: flex;
            justify-content: center;
        }

        .container {
            width: 100%;
            max-width: 500px;
        }

        header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 30px;
        }

        h2 { font-size: 1.5rem; margin: 0; font-weight: 700; background: linear-gradient(to right, #4ade80, #22c55e); -webkit-background-clip: text; -webkit-text-fill-color: transparent; }

        .btn-back {
            background: rgba(255,255,255,0.05);
            border: 1px solid rgba(255,255,255,0.1);
            color: var(--text-main);
            padding: 8px 16px;
            border-radius: 12px;
            cursor: pointer;
            backdrop-filter: blur(5px);
        }

        /* 로딩 바 */
        #loadingBarContainer {
            position: fixed; top: 0; left: 0; width: 100%; height: 4px; z-index: 100;
        }
        #loadingBar { width: 0; height: 100%; background: var(--primary); transition: width 0.4s ease; }

        /* 회원별 카드 */
        .member-card {
            background: var(--card-bg);
            border-radius: 20px;
            padding: 20px;
            margin-bottom: 16px;
            box-shadow: 0 10px 15px -3px rgba(0, 0, 0, 0.3);
            border: 1px solid rgba(255,255,255,0.05);
            transition: transform 0.2s;
        }

        .card-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 15px;
        }

        .name { font-size: 1.1rem; font-weight: 700; }
        .pt-count { font-size: 0.9rem; font-weight: 600; padding: 4px 10px; border-radius: 20px; }
        .pt-normal { background: rgba(34, 197, 94, 0.1); color: #4ade80; }
        .pt-low { background: rgba(239, 68, 68, 0.1); color: #f87171; }

        /* 프로그레스 바 디자인 */
        .progress-track {
            width: 100%;
            height: 12px;
            background: rgba(255,255,255,0.05);
            border-radius: 10px;
            overflow: hidden;
            position: relative;
        }

        .progress-fill {
            height: 100%;
            width: 0%; /* 애니메이션으로 채워짐 */
            border-radius: 10px;
            background: linear-gradient(90deg, #4ade80, #22c55e);
            transition: width 1s cubic-bezier(0.34, 1.56, 0.64, 1);
        }

        .low-fill {
            background: linear-gradient(90deg, #f87171, #ef4444);
        }

        .label-group {
            display: flex;
            justify-content: space-between;
            margin-top: 8px;
            font-size: 0.8rem;
            color: var(--text-sub);
        }
    </style>
</head>
<body>

<div id="loadingBarContainer"><div id="loadingBar"></div></div>

<div class="container">
    <header>
        <h2>PT 잔여 리포트</h2>
        <button class="btn-back" onclick="location.href='index.html'">목록으로</button>
    </header>

    <div id="reportList">
        </div>
</div>

<script>
    const API = "https://script.google.com/macros/s/AKfycbyDxpufb43p7KP9LrrANZm4wFnyHFiMuKrJu9fjnsBA6kcbXu-QKvK3-VydebDBZXKK/exec";

    async function loadReport() {
        const bar = document.getElementById('loadingBar');
        const list = document.getElementById('reportList');
        
        try {
            bar.style.width = "40%";
            const res = await fetch(`${API}?action=members`);
            bar.style.width = "80%";
            const json = await res.json();
            const members = json.data || [];

            list.innerHTML = "";
            bar.style.width = "100%";

            members.forEach(m => {
                const pt = Number(m.pt || 0);
                const maxPT = 30; // 기준을 30회로 설정 (필요시 수정)
                let percent = (pt / maxPT) * 100;
                if (percent > 100) percent = 100;

                const isLow = pt <= 3;
                
                const card = document.createElement('div');
                card.className = 'member-card';
                card.innerHTML = `
                    <div class="card-header">
                        <span class="name">${m.name} 회원님</span>
                        <span class="pt-count ${isLow ? 'pt-low' : 'pt-normal'}">${pt}회 남음</span>
                    </div>
                    <div class="progress-track">
                        <div class="progress-fill ${isLow ? 'low-fill' : ''}" style="width: 0%"></div>
                    </div>
                    <div class="label-group">
                        <span>상태: ${isLow ? '재등록 권장' : '안정'}</span>
                        <span>최대 30회 기준</span>
                    </div>
                `;
                list.appendChild(card);

                // 애니메이션 효과를 위해 시간차를 두고 width 설정
                setTimeout(() => {
                    card.querySelector('.progress-fill').style.width = percent + "%";
                }, 100);
            });

            setTimeout(() => { bar.style.width = "0"; }, 500);

        } catch (e) {
            alert("데이터를 가져오는 중 오류가 발생했습니다.");
        }
    }

    window.onload = loadReport;
</script>

</body>
</html>

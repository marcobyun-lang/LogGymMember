<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <title>PT 잔여 PT 리포트</title>
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <script>if (sessionStorage.getItem("admin") !== "1") location.href = "admin.html";</script>
    <link rel="stylesheet" as="style" crossorigin href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/static/pretendard.min.css" />
    <style>
        :root {
            --bg: #05080f; /* index와 동일한 깊은 배경색 */
            --card-bg: #111827;
            --primary: #10b981;
            --danger: #f43f5e;
            --text-main: #f1f5f9;
            --text-sub: #94a3b8;
            --glass-border: rgba(255, 255, 255, 0.08);
            --grid-color: rgba(16, 185, 129, 0.04);
        }

        body { 
            font-family: 'Pretendard', sans-serif; 
            background: var(--bg); 
            color: var(--text-main); 
            margin: 0; padding: 20px;
            /* index의 더 밝은 방사형 광채 적용 */
            background-image: 
                radial-gradient(circle at 100% 0%, rgba(16, 185, 129, 0.08) 0%, transparent 40%),
                radial-gradient(circle at 0% 100%, rgba(16, 185, 129, 0.05) 0%, transparent 40%),
                var(--bg);
            -webkit-font-smoothing: antialiased;
            position: relative;
            min-height: 100vh;
            overflow-x: hidden;
            overscroll-behavior-y: contain;
        }

        /* index의 역동적인 사선 + 격자 패턴 완벽 복사 */
        body::before {
            content: "";
            position: fixed;
            top: -50%; left: -50%; width: 200%; height: 200%;
            background-image: 
                repeating-linear-gradient(45deg, var(--grid-color) 0px, var(--grid-color) 1px, transparent 1px, transparent 15px),
                linear-gradient(var(--grid-color) 1px, transparent 1px),
                linear-gradient(90deg, var(--grid-color) 1px, transparent 1px);
            background-size: 100px 100px, 40px 40px, 40px 40px;
            transform: rotate(-5deg);
            pointer-events: none;
            z-index: -1;
            opacity: 0.6;
        }

        .container { width: 100%; max-width: 500px; margin: 0 auto; position: relative; z-index: 1; }
        
        header { margin-bottom: 20px; display: flex; justify-content: space-between; align-items: center; }
        header h2 { 
            font-size: 1.6rem; font-weight: 900; margin: 0; letter-spacing: -1px;
            background: linear-gradient(to bottom right, #fff 30%, var(--primary)); 
            -webkit-background-clip: text; -webkit-text-fill-color: transparent;
            text-transform: uppercase;
        }

        .filter-bar {
            display: flex;
            gap: 8px;
            margin-bottom: 25px;
        }
        .filter-btn {
            flex: 1;
            padding: 10px;
            border-radius: 12px;
            border: 1px solid var(--glass-border);
            background: rgba(255, 255, 255, 0.05);
            backdrop-filter: blur(8px);
            color: var(--text-sub);
            font-size: 0.85rem;
            font-weight: 600;
            cursor: pointer;
            transition: all 0.2s ease;
        }
        .filter-btn.active {
            background: var(--primary);
            color: #05080f;
            border-color: var(--primary);
            box-shadow: 0 0 15px rgba(16, 185, 129, 0.3);
        }

        .back-link { 
            color: var(--text-sub); 
            text-decoration: none; 
            font-size: 0.85rem; 
            font-weight: 600;
            border: 1px solid var(--glass-border); 
            padding: 10px 18px; 
            border-radius: 12px; 
            background: rgba(255,255,255,0.05); 
            backdrop-filter: blur(8px);
            transition: all 0.3s ease;
            display: inline-flex;
            align-items: center;
        }
        .back-link:hover {
            background: rgba(255, 255, 255, 0.1);
            color: #fff;
            transform: translateY(-2px);
            border-color: var(--primary);
        }

        #mainProgressBar { position: fixed; top: 0; left: 0; width: 0%; height: 3px; background: var(--primary); z-index: 1000; box-shadow: 0 0 10px var(--primary); }

        .grid-container { 
            display: grid; 
            grid-template-columns: 1fr 1fr; 
            gap: 12px; 
        }

        .member-card { 
            background: rgba(17, 24, 39, 0.7);
            backdrop-filter: blur(15px);
            border-radius: 20px; 
            padding: 18px; 
            border: 1px solid rgba(255, 255, 255, 0.05);
            display: flex;
            flex-direction: column;
            justify-content: space-between;
            box-shadow: 0 8px 25px rgba(0,0,0,0.3);
            cursor: grab;
            user-select: none;
            transition: transform 0.2s, border-color 0.2s;
        }
        .member-card:hover {
            border-color: rgba(16, 185, 129, 0.3);
            transform: translateY(-2px);
        }
        .member-card.dragging {
            opacity: 0.1;
            transform: scale(0.95);
        }

        .card-header { display: flex; flex-direction: column; margin-bottom: 12px; }
        .name { font-weight: 800; font-size: 0.95rem; margin-bottom: 4px; letter-spacing: -0.3px; }
        .teacher-info { font-size: 0.7rem; color: var(--text-sub); font-weight: 500; }
        
        .count-area { margin-top: 10px; display: flex; align-items: baseline; gap: 4px; }
        .count { font-size: 1.6rem; font-weight: 900; color: var(--primary); }
        .unit { font-size: 0.75rem; color: var(--text-sub); font-weight: 600; }
        
        .low-text { color: var(--danger) !important; filter: drop-shadow(0 0 5px rgba(244, 63, 94, 0.3)); }
        
        .prog-track { width: 100%; height: 5px; background: rgba(255,255,255,0.05); border-radius: 10px; overflow: hidden; margin-top: 14px; }
        .prog-fill { height: 100%; background: linear-gradient(90deg, var(--primary), #6ee7b7); border-radius: 10px; transition: width 1s ease-out; }
        .low-fill { background: linear-gradient(90deg, var(--danger), #fb7185) !important; }
        
        .alert-dot { 
            width: 7px; height: 7px; background: var(--danger); border-radius: 50%; 
            display: inline-block; margin-right: 6px; vertical-align: middle;
            box-shadow: 0 0 8px var(--danger);
        }
    </style>
</head>
<body>
    <div id="mainProgressBar"></div>
    <div class="container">
        <header>
            <h2>잔여 PT 리포트</h2>
            <a href="index.html" class="back-link">닫기</a>
        </header>

        <div class="filter-bar">
            <button id="sortAsc" class="filter-btn active" onclick="setSort('asc')">낮은 순 ↑</button>
            <button id="sortDesc" class="filter-btn" onclick="setSort('desc')">높은 순 ↓</button>
        </div>

        <div id="reportGrid" class="grid-container"></div>
    </div>

    <script>
        const API = "https://script.google.com/macros/s/AKfycby80GPaE8yuwvk8CE6Jq935bZL3PVwvg7a_gChDwW9JYC1YAEPsqiTf4yRxBlsIbKe8/exec";
        const ORDER_KEY = 'member_display_order';
        let currentData = [];
        let currentSort = 'asc';

        function getSavedOrder() { return JSON.parse(localStorage.getItem(ORDER_KEY) || '[]'); }
        function saveOrder(order) { localStorage.setItem(ORDER_KEY, JSON.stringify(order)); }

        function setSort(type) {
            currentSort = type;
            document.querySelectorAll('.filter-btn').forEach(btn => btn.classList.remove('active'));
            if(type === 'asc') document.getElementById('sortAsc').classList.add('active');
            else document.getElementById('sortDesc').classList.add('active');
            renderData();
        }

        async function loadReport() {
            const bar = document.getElementById('mainProgressBar');
            bar.style.width = "30%";
            try {
                const res = await fetch(`${API}?action=members`);
                const json = await res.json();
                currentData = json.data.filter(m => m && m.name);
                bar.style.width = "70%";
                renderData();
                bar.style.width = "100%";
                setTimeout(() => { bar.style.width = "0"; }, 500);
            } catch (e) { console.error(e); }
        }

        function renderData() {
            const grid = document.getElementById('reportGrid');
            grid.innerHTML = "";
            let sortedMembers = [...currentData];
            if(currentSort === 'asc') {
                sortedMembers.sort((a, b) => Number(a.pt || 0) - Number(b.pt || 0));
            } else {
                sortedMembers.sort((a, b) => Number(b.pt || 0) - Number(a.pt || 0));
            }
            sortedMembers.forEach((m) => {
                const pt = Number(m.pt || 0);
                const isLow = pt <= 3;
                const card = document.createElement('div');
                card.className = 'member-card';
                card.id = String(m.id);
                card.draggable = true;
                card.innerHTML = `
                    <div>
                        <div class="card-header">
                            <span class="name">${isLow ? '<span class="alert-dot"></span>' : ''}${m.name} 회원님</span>
                            <span class="teacher-info">${m.teacher || '미지정'} 트레이너 💪</span>
                        </div>
                        <div class="count-area">
                            <span class="count ${isLow ? 'low-text' : ''}">${pt}</span>
                            <span class="unit">회 남음</span>
                        </div>
                    </div>
                    <div class="prog-track"><div class="prog-fill ${isLow ? 'low-fill' : ''}" style="width: ${Math.min((pt/20)*100, 100)}%"></div></div>
                `;
                card.addEventListener('dragstart', () => setTimeout(() => card.classList.add('dragging'), 0));
                card.addEventListener('dragend', () => {
                    card.classList.remove('dragging');
                    saveOrder([...document.querySelectorAll('.member-card')].map(c => c.id));
                });
                grid.appendChild(card);
            });
        }
        loadReport();
    </script>
</body>
</html>

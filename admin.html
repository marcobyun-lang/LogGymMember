<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>관리자 로그인 | PT Members Professional</title>
    <link rel="stylesheet" as="style" crossorigin href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/static/pretendard.min.css" />
    <style>
        :root { 
            --bg: #05080f; 
            --card-bg: #111827; 
            --accent: #10b981; 
            --accent-glow: rgba(16, 185, 129, 0.3);
            --text-main: #f1f5f9; 
            --text-sub: #94a3b8; 
            --glass-border: rgba(255, 255, 255, 0.08);
            --grid-color: rgba(16, 185, 129, 0.04);
        }

        body { 
            font-family: 'Pretendard', sans-serif; 
            background: var(--bg); 
            /* 메인과 동일한 역동적인 네온 그라데이션 배경 */
            background-image: 
                radial-gradient(circle at 100% 0%, rgba(16, 185, 129, 0.1) 0%, transparent 40%),
                radial-gradient(circle at 0% 100%, rgba(16, 185, 129, 0.07) 0%, transparent 40%),
                var(--bg);
            color: var(--text-main); 
            display: flex; 
            justify-content: center; 
            align-items: center; 
            height: 100vh; 
            margin: 0; 
            overflow: hidden;
            position: relative;
        }

        /* 역동적인 사선 패턴 */
        body::before {
            content: "";
            position: fixed;
            top: -50%; left: -50%; width: 200%; height: 200%;
            background-image: 
                repeating-linear-gradient(45deg, var(--grid-color) 0px, var(--grid-color) 1px, transparent 1px, transparent 15px),
                linear-gradient(var(--grid-color) 1px, transparent 1px),
                linear-gradient(90deg, var(--grid-color) 1px, transparent 1px);
            background-size: 100px 100px, 40px 40px, 40px 40px;
            transform: rotate(-5deg);
            pointer-events: none;
            z-index: -1;
            opacity: 0.6;
        }

        .box { 
            background: linear-gradient(135deg, rgba(31, 41, 55, 0.8), rgba(17, 24, 39, 0.9));
            backdrop-filter: blur(20px);
            padding: 40px 30px; 
            border-radius: 24px; 
            width: 320px; 
            border: 1px solid var(--glass-border);
            box-shadow: 0 25px 50px -12px rgba(0, 0, 0, 0.5);
            text-align: center;
            z-index: 1;
        }

        h3 { 
            margin-top: 0; 
            margin-bottom: 30px;
            font-size: 1.5rem;
            font-weight: 900;
            letter-spacing: 2px;
            background: linear-gradient(to bottom right, #fff 30%, var(--accent)); 
            -webkit-background-clip: text; 
            -webkit-text-fill-color: transparent;
            text-transform: uppercase;
        }

        input { 
            width: 100%; 
            padding: 14px 18px; 
            margin-top: 12px; 
            background: rgba(255, 255, 255, 0.05); 
            border: 1px solid var(--glass-border); 
            color: #fff; 
            border-radius: 14px; 
            box-sizing: border-box; 
            font-size: 0.95rem;
            transition: all 0.3s;
        }

        input:focus { 
            outline: none; 
            border-color: var(--accent); 
            background: rgba(16, 185, 129, 0.05);
            box-shadow: 0 0 0 4px rgba(16, 185, 129, 0.1);
        }

        /* 로그인 버튼 네온 글로우 효과 적용 */
        button { 
            width: 100%; 
            padding: 16px; 
            margin-top: 30px; 
            background: var(--accent); 
            border: none; 
            color: #000; 
            font-weight: 800; 
            font-size: 1rem;
            border-radius: 16px; 
            cursor: pointer; 
            transition: all 0.3s cubic-bezier(0.4, 0, 0.2, 1);
            box-shadow: 0 8px 15px -5px var(--accent-glow);
        }

        button:hover { 
            transform: translateY(-3px) scale(1.02);
            filter: brightness(1.1);
            box-shadow: 0 15px 25px -5px rgba(16, 185, 129, 0.4); 
        }

        button:active {
            transform: translateY(-1px) scale(0.98);
        }

        button:disabled { 
            background: #334155; 
            color: #94a3b8;
            cursor: not-allowed; 
            box-shadow: none;
            transform: none;
        }
        
        /* Progress Bar 디자인 개선 */
        .progress-container { 
            width: 100%; 
            background: rgba(255, 255, 255, 0.05); 
            height: 4px; 
            border-radius: 10px; 
            margin-top: 25px; 
            display: none; 
            overflow: hidden; 
        }
        .progress-bar { 
            width: 0%; 
            height: 100%; 
            background: linear-gradient(90deg, var(--accent), #6EE7B7); 
            box-shadow: 0 0 10px var(--accent);
            transition: width 0.4s ease; 
        }

        .footer-text {
            margin-top: 20px;
            font-size: 0.75rem;
            color: var(--text-sub);
            letter-spacing: 0.5px;
        }
    </style>
</head>
<body>

<div class="box">
    <h3>GYM ADMIN</h3>
    <input id="userId" placeholder="아이디">
    <input id="userPw" type="password" placeholder="비밀번호">
    <button id="loginBtn" onclick="login()">로그인 시스템 접속</button>
    
    <div class="progress-container" id="progBox">
        <div class="progress-bar" id="progBar"></div>
    </div>
    
    <div class="footer-text">Professional PT Management System</div>
</div>

<script>
const API_URL = "https://script.google.com/macros/s/AKfycby80GPaE8yuwvk8CE6Jq935bZL3PVwvg7a_gChDwW9JYC1YAEPsqiTf4yRxBlsIbKe8/exec";

function login() {
    const idValue = document.getElementById("userId").value;
    const pwValue = document.getElementById("userPw").value;
    const btn = document.getElementById("loginBtn");
    const progBox = document.getElementById("progBox");
    const progBar = document.getElementById("progBar");

    if(!idValue || !pwValue) {
        alert("아이디와 비밀번호를 모두 입력해주세요.");
        return;
    }

    btn.disabled = true;
    progBox.style.display = "block";
    // 부드러운 시작 애니메이션
    setTimeout(() => { progBar.style.width = "40%"; }, 10);

    fetch(API_URL, {
        method: "POST",
        body: JSON.stringify({ 
            action: "login", 
            id: idValue, 
            password: pwValue 
        })
    })
    .then(r => r.json())
    .then(res => {
        progBar.style.width = "100%";
        if (res.result === "success") {
            sessionStorage.setItem("admin", "1");
            setTimeout(() => { location.href = "index.html"; }, 500);
        } else {
            setTimeout(() => {
                alert("아이디 또는 비밀번호가 일치하지 않습니다.");
                resetUI();
            }, 500);
        }
    })
    .catch(err => {
        console.error(err);
        alert("서버 통신 중 오류가 발생했습니다.");
        resetUI();
    });

    function resetUI() {
        btn.disabled = false;
        progBox.style.display = "none";
        progBar.style.width = "0%";
    }
}

document.addEventListener('keypress', function (e) {
    if (e.key === 'Enter') login();
});
</script>

</body>
</html>

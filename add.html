<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <title>신규 회원 등록</title>
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <script>if (sessionStorage.getItem("admin") !== "1") location.href = "admin.html";</script>
    <link href="https://fonts.googleapis.com/css2?family=Noto+Sans+KR:wght@400;500;700&display=swap" rel="stylesheet">
    <style>
        :root { 
            --bg: #0b0f1a; 
            --card-bg: #161e2d; 
            --primary: #10b981; 
            --primary-glow: rgba(16, 185, 129, 0.2);
            --text-main: #f1f5f9; 
            --text-sub: #94a3b8; 
            --glass-border: rgba(255, 255, 255, 0.08);
        }

        body { 
            font-family: 'Pretendard', sans-serif; 
            background: var(--bg); 
            color: var(--text-main); 
            margin: 0; 
            padding: 20px;
            background-image: radial-gradient(circle at 50% -20%, #1e293b 0%, var(--bg) 80%);
        }

        .container { max-width: 500px; margin: 0 auto; }

        header { display: flex; justify-content: space-between; align-items: center; margin-bottom: 25px; }
        header h2 { margin: 0; font-size: 1.4rem; font-weight: 800; }
        
        /* 닫기 버튼 효과 */
        .back-link { 
            color: var(--text-sub); 
            text-decoration: none; 
            font-size: 0.85rem; 
            font-weight: 600;
            padding: 8px 16px; 
            border-radius: 12px; 
            border: 1px solid var(--glass-border); 
            background: rgba(255,255,255,0.03); 
            transition: all 0.3s cubic-bezier(0.4, 0, 0.2, 1); 
        }
        .back-link:hover {
            background: rgba(255,255,255,0.1);
            color: #fff;
            transform: translateY(-2px);
            border-color: var(--text-sub);
        }
        .back-link:active { transform: scale(0.95); }

        .card { 
            background: var(--card-bg); 
            border-radius: 24px; 
            padding: 25px; 
            border: 1px solid var(--glass-border); 
            box-shadow: 0 10px 25px -5px rgba(0,0,0,0.3);
        }

        .form-group { margin-bottom: 18px; }
        label { display: block; font-size: 0.85rem; color: var(--text-sub); margin-bottom: 8px; font-weight: 500; }

        input, textarea, select { 
            width: 100%; padding: 14px; border-radius: 14px; 
            border: 1px solid var(--glass-border); 
            background: #0b0f1a; 
            color: white; font-size: 1rem; box-sizing: border-box; 
            outline: none; transition: all 0.2s;
            font-family: inherit;
        }
        input:focus, textarea:focus, select:focus { 
            border-color: var(--primary); 
            background: rgba(16, 185, 129, 0.05);
        }

        /* 등록 완료 버튼 효과 */
        .btn-submit { 
            width: 100%; padding: 16px; border-radius: 16px; border: none; 
            background: var(--primary); color: #064e3b; 
            font-weight: 700; font-size: 1rem; cursor: pointer; 
            margin-top: 10px; 
            transition: all 0.3s cubic-bezier(0.4, 0, 0.2, 1);
            box-shadow: 0 4px 12px var(--primary-glow);
        }
        .btn-submit:hover {
            transform: translateY(-3px);
            filter: brightness(1.1);
            box-shadow: 0 8px 20px rgba(16, 185, 129, 0.4);
        }
        .btn-submit:active {
            transform: scale(0.97) translateY(0);
        }
        .btn-submit:disabled {
            background: #334155;
            color: #94a3b8;
            cursor: not-allowed;
            transform: none;
            box-shadow: none;
        }
    </style>
</head>
<body>
    <div class="container">
        <header>
            <h2>회원 등록</h2>
            <a href="index.html" class="back-link">닫기</a>
        </header>
        <div class="card">
            <div class="form-group">
                <label>이름</label>
                <input type="text" id="name" placeholder="회원 성함을 입력하세요">
            </div>
            <div class="form-group">
                <label>담당 선생님</label>
                <input type="text" id="teacher" placeholder="담당 강사 이름">
            </div>
            <div class="form-group">
                <label>연락처</label>
                <input type="tel" id="phone" placeholder="010-0000-0000">
            </div>
            <div class="form-group">
                <label>운동 목적</label>
                <select id="goal">
                    <option value="다이어트">🔥 다이어트</option>
                    <option value="근력 향상">💪 근력 향상</option>
                    <option value="체형 교정">🧘 체형 교정</option>
                    <option value="바디 프로필">📸 바디 프로필</option>
                    <option value="재활 및 통증 완화">🏥 재활 및 통증 완화</option>
                    <option value="기타">✏️ 기타 (메모 기입)</option>
                </select>
            </div>
            <div class="form-group">
                <label>PT 횟수</label>
                <input type="number" id="pt" value="10">
            </div>
            <div class="form-group">
                <label>주소</label>
                <input type="text" id="address" placeholder="거주지 또는 직장 주소">
            </div>
            <div class="form-group">
                <label>메모</label>
                <textarea id="memo" rows="3" placeholder="특이사항이나 건강상태를 입력하세요" style="resize:none;"></textarea>
            </div>
            <button class="btn-submit" id="submitBtn" onclick="submit()">등록 완료</button>
        </div>
    </div>
    <script>
        const API = "https://script.google.com/macros/s/AKfycby80GPaE8yuwvk8CE6Jq935bZL3PVwvg7a_gChDwW9JYC1YAEPsqiTf4yRxBlsIbKe8/exec";
        
        async function submit() {
            const btn = document.getElementById('submitBtn');
            const name = document.getElementById('name').value;
            
            if(!name) {
                alert("이름은 필수 입력 항목입니다.");
                return;
            }

            btn.disabled = true; 
            btn.innerText = "등록 중...";
            
            const payload = {
                action: "addMember",
                name: name,
                teacher: document.getElementById('teacher').value,
                phone: document.getElementById('phone').value,
                goal: document.getElementById('goal').value,
                pt: document.getElementById('pt').value,
                address: document.getElementById('address').value,
                memo: document.getElementById('memo').value
            };

            try {
                const res = await fetch(API, { method: 'POST', body: JSON.stringify(payload) });
                const result = await res.json();
                if(result.result === "success") {
                    location.href = "index.html";
                } else {
                    alert("등록 실패: " + result.message);
                    btn.disabled = false;
                    btn.innerText = "등록 완료";
                }
            } catch(e) { 
                alert("통신 오류가 발생했습니다."); 
                btn.disabled = false; 
                btn.innerText = "등록 완료";
            }
        }
    </script>
</body>
</html>

<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <title>PT 회원 관리 시스템</title>
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <script>
        if (sessionStorage.getItem("admin") !== "1") location.href = "admin.html";
    </script>
    <link href="https://fonts.googleapis.com/css2?family=Pretendard:wght@400;600;700&display=swap" rel="stylesheet">
    <style>
        :root {
            --bg: #0f172a;
            --card-bg: #1e293b;
            --primary: #22c55e;
            --danger: #ef4444;
            --text-main: #f8fafc;
            --text-sub: #94a3b8;
        }
        body { font-family: 'Pretendard', sans-serif; background: var(--bg); color: var(--text-main); margin: 0; padding: 20px; }
        .container { max-width: 500px; margin: 0 auto; }
        
        /* 메인 로딩 프로그레스 바 */
        #mainLoaderContainer {
            position: fixed; top: 0; left: 0; width: 100%; height: 4px; background: rgba(255,255,255,0.05); z-index: 1000;
        }
        #mainProgressBar {
            width: 0%; height: 100%; background: linear-gradient(90deg, #4ade80, #22c55e); transition: width 0.3s ease; box-shadow: 0 0 10px var(--primary);
        }

        header { margin-bottom: 25px; }
        h2 { font-size: 1.5rem; font-weight: 700; background: linear-gradient(to right, #4ade80, #22c55e); -webkit-background-clip: text; -webkit-text-fill-color: transparent; margin-bottom: 20px; }
        
        .nav-buttons { display: flex; gap: 10px; margin-bottom: 20px; }
        .nav-btn { flex: 1; padding: 14px; border-radius: 12px; border: 1px solid rgba(255,255,255,0.1); background: var(--card-bg); color: var(--text-main); font-weight: 600; cursor: pointer; transition: 0.2s; }

        .search-box { width: 100%; padding: 14px; border-radius: 12px; border: 1px solid rgba(255,255,255,0.1); background: var(--card-bg); color: white; box-sizing: border-box; margin-bottom: 20px; outline: none; }

        /* 회원 카드 디자인 */
        .member-card { background: var(--card-bg); border-radius: 20px; padding: 18px; margin-bottom: 15px; border: 1px solid rgba(255,255,255,0.05); animation: fadeIn 0.5s ease forwards; opacity: 0; }
        @keyframes fadeIn { from { opacity: 0; transform: translateY(10px); } to { opacity: 1; transform: translateY(0); } }

        .card-top { display: flex; justify-content: space-between; align-items: center; margin-bottom: 12px; }
        .name { font-size: 1.1rem; font-weight: 700; }
        .pt-count { font-size: 0.85rem; padding: 4px 10px; border-radius: 20px; font-weight: 600; }
        .pt-normal { background: rgba(34, 197, 94, 0.1); color: #4ade80; }
        .pt-low { background: rgba(239, 68, 68, 0.1); color: #f87171; }

        .list-prog-container { width: 100%; height: 6px; background: rgba(255,255,255,0.05); border-radius: 10px; overflow: hidden; margin-bottom: 15px; }
        .list-prog-bar { height: 100%; background: linear-gradient(90deg, #4ade80, #22c55e); transition: width 1s cubic-bezier(0.34, 1.56, 0.64, 1); }

        .actions { display: flex; gap: 8px; }
        .btn-check { flex: 2; background: var(--primary); color: #000; border: none; padding: 10px; border-radius: 10px; font-weight: 700; cursor: pointer; }
        .btn-detail { flex: 1; background: rgba(255,255,255,0.05); color: var(--text-main); border: 1px solid rgba(255,255,255,0.1); padding: 10px; border-radius: 10px; cursor: pointer; }
    </style>
</head>
<body>
    <div id="mainLoaderContainer"><div id="mainProgressBar"></div></div>

    <div class="container">
        <header>
            <h2>PT Members</h2>
            <div class="nav-buttons">
                <button class="nav-btn" onclick="location.href='add.html'">회원 등록</button>
                <button class="nav-btn" onclick="location.href='status.html'">잔여 리포트</button>
            </div>
        </header>

        <input type="text" id="searchInput" class="search-box" placeholder="이름 또는 전화번호 검색..." onkeyup="filter()">
        <div id="memberList"></div>
    </div>

    <script>
        const API = "https://script.google.com/macros/s/AKfycbyDxpufb43p7KP9LrrANZm4wFnyHFiMuKrJu9fjnsBA6kcbXu-QKvK3-VydebDBZXKK/exec";
        let allData = [];

        async function load() {
            const bar = document.getElementById('mainProgressBar');
            try {
                // 로딩 시작
                bar.style.width = "30%";
                
                const res = await fetch(`${API}?action=members`);
                bar.style.width = "70%";
                
                const json = await res.json();
                allData = json.data;
                
                // 데이터 로드 완료
                bar.style.width = "100%";
                render(allData);
                
                // 완료 후 바 숨기기
                setTimeout(() => { bar.style.width = "0%"; }, 500);
            } catch (e) {
                alert("데이터 로드 실패");
                bar.style.backgroundColor = "var(--danger)";
            }
        }

        function render(data) {
            const list = document.getElementById("memberList");
            list.innerHTML = "";
            data.forEach((m, index) => {
                const pt = Number(m.pt || 0);
                const per = Math.min((pt / 30) * 100, 100);
                const isLow = pt <= 3;
                const div = document.createElement("div");
                div.className = "member-card";
                div.style.animationDelay = (index * 0.05) + "s"; // 순차적 등장 효과
                div.innerHTML = `
                    <div class="card-top">
                        <span class="name">${m.name}</span>
                        <span class="pt-count ${isLow ? 'pt-low' : 'pt-normal'}">잔여 ${pt}회</span>
                    </div>
                    <div class="list-prog-container">
                        <div class="list-prog-bar" style="width:0%; ${isLow ? 'background:#ef4444' : ''}"></div>
                    </div>
                    <div class="actions">
                        <button class="btn-check" onclick="checkIn('${m.id}', '${m.name}')">출석 체크</button>
                        <button class="btn-detail" onclick="location.href='member.html?id=${m.id}'">상세</button>
                    </div>
                `;
                list.appendChild(div);

                // 개별 카드 프로그레스 바 애니메이션
                setTimeout(() => {
                    div.querySelector('.list-prog-bar').style.width = per + "%";
                }, 100);
            });
        }

        function filter() {
            const txt = document.getElementById("searchInput").value.toLowerCase();
            const filtered = allData.filter(m => m.name.toLowerCase().includes(txt) || m.phone.includes(txt));
            render(filtered);
        }

        async function checkIn(id, name) {
            if(!confirm(`${name}님 출석하시겠습니까?`)) return;
            const bar = document.getElementById('mainProgressBar');
            bar.style.width = "50%";
            const res = await fetch(`${API}?action=checkin&memberId=${id}`);
            const result = await res.json();
            bar.style.width = "100%";
            if(result.result === "success") { 
                alert("출석 완료!"); 
                location.reload(); 
            }
        }
        load();
    </script>
</body>
</html>

<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <title>PT 회원 관리 시스템</title>
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <script>
        if (sessionStorage.getItem("admin") !== "1") location.href = "admin.html";
    </script>
    <link href="https://fonts.googleapis.com/css2?family=Pretendard:wght@400;600;700&display=swap" rel="stylesheet">
    <style>
        :root { 
            --bg: #0f172a; --card-bg: #1e293b; --primary: #22c55e; --danger: #ef4444; 
            --text-main: #f8fafc; --text-sub: #94a3b8; --star-on: #fbbf24; --star-off: #475569; 
        }
        body { font-family: 'Pretendard', sans-serif; background: var(--bg); color: var(--text-main); margin: 0; padding: 20px; }
        .container { max-width: 500px; margin: 0 auto; }
        #mainLoaderContainer { position: fixed; top: 0; left: 0; width: 100%; height: 4px; background: rgba(255,255,255,0.05); z-index: 1000; }
        #mainProgressBar { width: 0%; height: 100%; background: var(--primary); transition: width 0.3s ease; }
        
        header { margin-bottom: 25px; }
        .nav-buttons { display: flex; gap: 10px; margin-bottom: 20px; }
        .nav-btn { flex: 1; padding: 14px; border-radius: 12px; border: 1px solid rgba(255,255,255,0.1); background: var(--card-bg); color: var(--text-main); font-weight: 600; cursor: pointer; text-decoration: none; text-align: center; }
        
        .filter-group { display: flex; gap: 10px; margin-bottom: 20px; }
        .search-box { flex: 1.5; padding: 14px; border-radius: 12px; border: 1px solid rgba(255,255,255,0.1); background: var(--card-bg); color: white; outline: none; }
        .filter-select { flex: 1; padding: 14px; border-radius: 12px; border: 1px solid rgba(255,255,255,0.1); background: var(--card-bg); color: white; outline: none; }

        .member-card { background: var(--card-bg); border-radius: 20px; padding: 18px; margin-bottom: 15px; border: 1px solid rgba(255,255,255,0.05); }
        .card-top { display: flex; justify-content: space-between; align-items: center; margin-bottom: 12px; }
        .name-area { display: flex; align-items: center; gap: 10px; }
        .star-btn { background: none; border: none; cursor: pointer; font-size: 1.3rem; color: var(--star-off); padding: 0; line-height: 1; }
        .star-btn.on { color: var(--star-on); }
        .name { font-size: 1.1rem; font-weight: 700; }
        .pt-count { font-size: 0.85rem; padding: 4px 10px; border-radius: 20px; font-weight: 600; }
        .pt-normal { background: rgba(34, 197, 94, 0.1); color: #4ade80; }
        .pt-low { background: rgba(239, 68, 68, 0.1); color: #f87171; }
        
        .list-prog-container { width: 100%; height: 6px; background: rgba(255,255,255,0.05); border-radius: 10px; overflow: hidden; margin-bottom: 15px; }
        .list-prog-bar { height: 100%; background: var(--primary); transition: width 0.5s ease; }
        
        .actions { display: flex; gap: 8px; }
        .btn-check { flex: 2; background: var(--primary); color: #000; border: none; padding: 10px; border-radius: 10px; font-weight: 700; cursor: pointer; }
        .btn-detail { flex: 1; background: rgba(255,255,255,0.05); color: var(--text-main); border: 1px solid rgba(255,255,255,0.1); padding: 10px; border-radius: 10px; cursor: pointer; text-align: center; text-decoration: none; font-size: 0.9rem; display: flex; align-items: center; justify-content: center; }
    </style>
</head>
<body>
    <div id="mainLoaderContainer"><div id="mainProgressBar"></div></div>
    <div class="container">
        <header>
            <h2 style="margin: 0 0 20px 0; color: var(--primary);">PT Members</h2>
            <div class="nav-buttons">
                <a href="add.html" class="nav-btn">회원 등록</a>
                <a href="status.html" class="nav-btn">잔여 리포트</a>
            </div>
        </header>
        
        <div class="filter-group">
            <input type="text" id="searchInput" class="search-box" placeholder="이름 검색..." onkeyup="applyFilters()">
            <select id="teacherFilter" class="filter-select" onchange="applyFilters()">
                <option value="all">전체 담당</option>
            </select>
        </div>

        <div id="memberList"></div>
    </div>

    <script>
        const API = "https://script.google.com/macros/s/AKfycby80GPaE8yuwvk8CE6Jq935bZL3PVwvg7a_gChDwW9JYC1YAEPsqiTf4yRxBlsIbKe8/exec";
        let allData = [];

        function getFavs() { return JSON.parse(localStorage.getItem('fav_members') || '[]'); }
        function saveFavs(favs) { localStorage.setItem('fav_members', JSON.stringify(favs)); }

        async function load() {
            const bar = document.getElementById('mainProgressBar');
            bar.style.width = "30%";
            try {
                const res = await fetch(`${API}?action=members`);
                const json = await res.json();
                
                allData = (json.data || []).filter(m => m && (m.name || m.id));
                
                const select = document.getElementById('teacherFilter');
                const teachers = [...new Set(allData.map(m => String(m.teacher || '')).filter(t => t.trim() !== ''))];
                select.innerHTML = '<option value="all">전체 담당</option>';
                teachers.forEach(t => {
                    const opt = document.createElement('option');
                    opt.value = t; opt.innerText = t;
                    select.appendChild(opt);
                });
                
                bar.style.width = "100%";
                applyFilters(); 
                setTimeout(() => bar.style.width = "0", 500);
            } catch(e) { 
                console.error("Load Error:", e);
                alert("데이터 로드 중 오류가 발생했습니다."); 
            }
        }

        function applyFilters() {
            const searchTxt = document.getElementById("searchInput").value.toLowerCase();
            const teacherTxt = document.getElementById("teacherFilter").value;
            const favs = getFavs();
            
            let filtered = allData.filter(m => {
                const memberName = String(m.name || "").toLowerCase();
                const matchName = memberName.includes(searchTxt);
                const matchTeacher = (teacherTxt === "all") || (String(m.teacher || "") === teacherTxt);
                return matchName && matchTeacher;
            });

            filtered.sort((a, b) => {
                const aFav = favs.includes(String(a.id)) ? 1 : 0;
                const bFav = favs.includes(String(b.id)) ? 1 : 0;
                return bFav - aFav; 
            });
            
            render(filtered);
        }

        function render(data) {
            const list = document.getElementById("memberList");
            const favs = getFavs();
            list.innerHTML = "";

            if (data.length === 0) {
                list.innerHTML = '<div style="text-align:center; padding:50px; color:var(--text-sub);">일치하는 회원이 없습니다.</div>';
                return;
            }

            data.forEach((m) => {
                const pt = Number(m.pt || 0);
                const isFav = favs.includes(String(m.id));
                const teacherName = m.teacher || '미지정';
                
                const div = document.createElement("div");
                div.className = "member-card";
                div.id = `card-${m.id}`;
                div.innerHTML = `
                    <div class="card-top">
                        <div class="name-area">
                            <button class="star-btn ${isFav ? 'on' : ''}" onclick="toggleFav('${m.id}')">
                                ${isFav ? '★' : '☆'}
                            </button>
                            <span class="name">${m.name || '이름없음'} 회원님</span>
                        </div>
                        <span class="pt-count ${pt <= 3 ? 'pt-low' : 'pt-normal'}">${teacherName}T | 잔여 ${pt}회</span>
                    </div>
                    <div class="list-prog-container">
                        <div class="list-prog-bar" style="width:${Math.min((pt / 30) * 100, 100)}%; ${pt <= 3 ? 'background:#ef4444' : ''}"></div>
                    </div>
                    <div class="actions">
                        <button class="btn-check" onclick="checkIn('${m.id}', '${m.name}')">출석 체크</button>
                        <a href="member.html?id=${m.id}" class="btn-detail">상세</a>
                    </div>
                `;
                list.appendChild(div);
            });
        }

        function toggleFav(id) {
            id = String(id);
            let favs = getFavs();
            if (favs.includes(id)) {
                favs = favs.filter(f => f !== id);
            } else {
                favs.push(id);
            }
            saveFavs(favs);
            applyFilters(); 
        }

        async function checkIn(id, name) {
            if(!confirm(`${name} 회원님 출석하시겠습니까?`)) return;
            const bar = document.getElementById('mainProgressBar');
            bar.style.width = "50%";
            try {
                const res = await fetch(`${API}?action=checkin&memberId=${id}`);
                const result = await res.json();
                if(result.result === "success") {
                    bar.style.width = "100%";
                    const member = allData.find(m => String(m.id) === String(id));
                    if(member) member.pt = Number(member.pt) - 1;
                    applyFilters(); 
                    setTimeout(() => bar.style.width = "0", 500);
                }
            } catch(e) { alert("통신 오류"); bar.style.width = "0"; }
        }

        load();
    </script>
</body>
</html>

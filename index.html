<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <title>PT Members Professional</title>
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <script>
        if (sessionStorage.getItem("admin") !== "1") location.href = "admin.html";
    </script>
    <link rel="stylesheet" as="style" crossorigin href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/static/pretendard.min.css" />
    <style>
        :root { 
            --bg: #0b0f1a; 
            --card-bg: #161e2d; 
            --accent: #10b981; 
            --accent-glow: rgba(16, 185, 129, 0.2);
            --danger: #f43f5e; 
            --text-main: #f1f5f9; 
            --text-sub: #94a3b8; 
            --star-on: #fbbf24;
            --glass-border: rgba(255, 255, 255, 0.08);
        }

        body { 
            font-family: 'Pretendard', sans-serif; 
            background: var(--bg); 
            background-image: radial-gradient(circle at 50% -20%, #1e293b 0%, var(--bg) 80%);
            color: var(--text-main); 
            margin: 0; 
            padding: env(safe-area-inset-top) 16px 40px; 
            -webkit-font-smoothing: antialiased;
        }

        .container { max-width: 480px; margin: 0 auto; }

        #mainLoaderContainer { position: fixed; top: 0; left: 0; width: 100%; height: 3px; background: rgba(0,0,0,0.2); z-index: 2000; }
        #mainProgressBar { width: 0%; height: 100%; background: linear-gradient(90deg, #10b981, #34d399); box-shadow: 0 0 10px var(--accent); transition: width 0.4s cubic-bezier(0.4, 0, 0.2, 1); }
        
        header { padding: 30px 0 20px; }
        header h2 { font-size: 1.6rem; font-weight: 800; margin: 0 0 20px; letter-spacing: -0.5px; background: linear-gradient(to right, #fff, #94a3b8); -webkit-background-clip: text; -webkit-text-fill-color: transparent; }

        .nav-buttons { display: flex; gap: 10px; margin-bottom: 25px; }
        .nav-btn { 
            flex: 1; padding: 14px; border-radius: 14px; border: 1px solid var(--glass-border); 
            background: var(--card-bg); color: var(--text-main); font-weight: 600; font-size: 0.95rem; 
            cursor: pointer; text-decoration: none; text-align: center; 
            transition: all 0.3s cubic-bezier(0.4, 0, 0.2, 1);
            position: relative; overflow: hidden;
            display: flex; align-items: center; justify-content: center;
        }
        .nav-btn:hover {
            background: rgba(255, 255, 255, 0.08);
            border-color: var(--accent);
            transform: translateY(-3px);
            box-shadow: 0 8px 20px -5px rgba(16, 185, 129, 0.3);
            color: var(--accent);
        }
        .nav-btn:active { transform: scale(0.96) translateY(0); }
        
        .filter-group { display: flex; gap: 8px; margin-bottom: 24px; }
        .search-box { flex: 1.5; padding: 14px 18px; border-radius: 14px; border: 1px solid var(--glass-border); background: rgba(255,255,255,0.03); color: white; outline: none; transition: 0.2s; font-size: 0.95rem; }
        .search-box:focus { border-color: var(--accent); background: rgba(255,255,255,0.06); }
        .filter-select { flex: 1; padding: 14px; border-radius: 14px; border: 1px solid var(--glass-border); background: #1e293b; color: white; cursor: pointer; font-size: 0.9rem; }

        .member-card { 
            background: var(--card-bg); border-radius: 24px; padding: 20px; margin-bottom: 16px; 
            border: 1px solid var(--glass-border); box-shadow: 0 10px 25px -5px rgba(0,0,0,0.3);
            cursor: grab; transition: transform 0.2s, box-shadow 0.2s, opacity 0.2s;
            user-select: none; will-change: transform;
        }
        .member-card:active { cursor: grabbing; }
        .member-card.dragging { opacity: 0.1; transform: scale(0.95); border: 1px dashed var(--accent); }

        .card-top { display: flex; justify-content: space-between; align-items: center; margin-bottom: 16px; }
        .name-area { display: flex; align-items: center; gap: 12px; }
        .star-btn { background: none; border: none; cursor: pointer; font-size: 1.4rem; color: #334155; padding: 0; transition: 0.2s; }
        .star-btn.on { color: var(--star-on); transform: scale(1.1); }
        .name { font-size: 1.15rem; font-weight: 700; }
        
        .tag { font-size: 0.75rem; padding: 4px 10px; border-radius: 8px; font-weight: 600; }
        .tag-normal { background: rgba(16, 185, 129, 0.1); color: #34d399; }
        .tag-low { background: rgba(244, 63, 94, 0.1); color: #fb7185; }
        
        .info-row { display: flex; justify-content: space-between; align-items: center; margin-bottom: 8px; }
        .teacher-label { font-size: 0.85rem; color: var(--text-sub); display: flex; align-items: center; gap: 4px; }
        .pt-status { font-size: 0.9rem; font-weight: 600; }

        .list-prog-container { width: 100%; height: 8px; background: rgba(255,255,255,0.04); border-radius: 10px; overflow: hidden; margin-bottom: 20px; }
        .list-prog-bar { height: 100%; background: linear-gradient(90deg, var(--accent), #34d399); transition: width 0.8s; }
        
        .actions { display: flex; gap: 10px; }
        .btn-check { 
            flex: 2; background: var(--accent); color: #064e3b; border: none; padding: 14px; border-radius: 16px; 
            font-weight: 700; cursor: pointer; transition: all 0.3s cubic-bezier(0.4, 0, 0.2, 1); 
            box-shadow: 0 4px 12px var(--accent-glow);
        }
        .btn-check:hover { transform: translateY(-2px); filter: brightness(1.1); box-shadow: 0 6px 20px rgba(16, 185, 129, 0.4); }
        .btn-detail { 
            flex: 1; background: rgba(255, 255, 255, 0.05); color: var(--text-main); border: 1px solid var(--glass-border); 
            padding: 14px; border-radius: 16px; text-align: center; text-decoration: none; font-size: 0.9rem; 
            font-weight: 600; transition: all 0.3s ease; 
        }
        .btn-detail:hover { background: rgba(255, 255, 255, 0.12); border-color: rgba(255, 255, 255, 0.3); transform: translateY(-2px); }
    </style>
</head>
<body>
    <div id="mainLoaderContainer"><div id="mainProgressBar"></div></div>
    <div class="container">
        <header>
            <h2>PT Members</h2>
            <div class="nav-buttons">
                <a href="add.html" class="nav-btn">회원 등록</a>
                <a href="status.html" class="nav-btn">잔여 리포트</a>
            </div>
        </header>
        
        <div class="filter-group">
            <input type="text" id="searchInput" class="search-box" placeholder="회원 이름 검색" onkeyup="applyFilters()">
            <select id="teacherFilter" class="filter-select" onchange="applyFilters()">
                <option value="all">전체 트레이너님</option>
            </select>
        </div>

        <div id="memberList"></div>
    </div>

    <script>
        const API = "https://script.google.com/macros/s/AKfycby80GPaE8yuwvk8CE6Jq935bZL3PVwvg7a_gChDwW9JYC1YAEPsqiTf4yRxBlsIbKe8/exec";
        let allData = [];
        const ORDER_KEY = 'member_display_order';

        function getFavs() { return JSON.parse(localStorage.getItem('fav_members') || '[]'); }
        function saveFavs(favs) { localStorage.setItem('fav_members', JSON.stringify(favs)); }
        function getSavedOrder() { return JSON.parse(localStorage.getItem(ORDER_KEY) || '[]'); }
        function saveOrder(order) { localStorage.setItem(ORDER_KEY, JSON.stringify(order)); }

        async function load() {
            const bar = document.getElementById('mainProgressBar');
            bar.style.width = "30%";
            try {
                const res = await fetch(`${API}?action=members`);
                const json = await res.json();
                allData = (json.data || []).filter(m => m && (m.name || m.id));
                
                const select = document.getElementById('teacherFilter');
                
                // 트레이너 목록 추출
                const teachers = [...new Set(allData.map(m => String(m.teacher || '').trim()).filter(t => t !== ''))];
                
                // 미지정 데이터가 있는지 확인
                const hasNoTeacher = allData.some(m => !m.teacher || String(m.teacher).trim() === "");
                
                // 필터 UI 구성
                select.innerHTML = '<option value="all">전체 트레이너님</option>';
                
                if(hasNoTeacher) {
                    select.innerHTML += '<option value="none">트레이너 미지정 ❓</option>';
                }
                
                teachers.forEach(t => {
                    const opt = document.createElement('option');
                    opt.value = t; opt.innerText = t + ' 트레이너님 💪';
                    select.appendChild(opt);
                });
                
                bar.style.width = "100%";
                applyFilters(); 
                setTimeout(() => bar.style.width = "0", 500);
            } catch(e) { alert("데이터 로드 실패"); }
        }

        function applyFilters() {
            const searchTxt = document.getElementById("searchInput").value.toLowerCase();
            const teacherTxt = document.getElementById("teacherFilter").value;
            const favs = getFavs();
            const savedOrder = getSavedOrder();
            
            let filtered = allData.filter(m => {
                const matchName = String(m.name || "").toLowerCase().includes(searchTxt);
                let matchTeacher = false;
                if (teacherTxt === "all") {
                    matchTeacher = true;
                } else if (teacherTxt === "none") {
                    matchTeacher = !m.teacher || String(m.teacher).trim() === "";
                } else {
                    matchTeacher = String(m.teacher || "") === teacherTxt;
                }
                return matchName && matchTeacher;
            });

            if(savedOrder.length > 0) {
                filtered.sort((a, b) => {
                    let idxA = savedOrder.indexOf(String(a.id));
                    let idxB = savedOrder.indexOf(String(b.id));
                    return (idxA === -1 ? 999 : idxA) - (idxB === -1 ? 999 : idxB);
                });
            }

            filtered.sort((a, b) => (favs.includes(String(b.id)) ? 1 : 0) - (favs.includes(String(a.id)) ? 1 : 0));
            render(filtered);
        }

        function render(data) {
            const list = document.getElementById("memberList");
            const favs = getFavs();
            list.innerHTML = "";

            data.forEach((m) => {
                const pt = Number(m.pt || 0);
                const isFav = favs.includes(String(m.id));
                const teacherName = m.teacher ? String(m.teacher).trim() : "";
                
                // 트레이너 정보 레이블 설정 (아이콘 포함)
                const teacherLabel = teacherName 
                    ? `<span>${teacherName} 트레이너님</span> <span>💪</span>` 
                    : `<span>트레이너 미지정</span> <span>❓</span>`;

                const div = document.createElement("div");
                div.className = "member-card";
                div.id = String(m.id);
                div.draggable = true;
                div.innerHTML = `
                    <div class="card-top">
                        <div class="name-area">
                            <button class="star-btn ${isFav ? 'on' : ''}" onclick="toggleFav('${m.id}')">★</button>
                            <span class="name">${m.name || '이름없음'} 회원님</span>
                        </div>
                        <span class="tag ${pt <= 3 ? 'tag-low' : 'tag-normal'}">${pt <= 3 ? '재등록 권유' : '정상'}</span>
                    </div>
                    <div class="info-row">
                        <span class="teacher-label">${teacherLabel}</span>
                        <span class="pt-status" style="color:${pt <= 3 ? 'var(--danger)' : 'var(--accent)'}">잔여 ${pt}회</span>
                    </div>
                    <div class="list-prog-container"><div class="list-prog-bar" style="width:${Math.min((pt/30)*100, 100)}%; ${pt<=3?'background:var(--danger)':''}"></div></div>
                    <div class="actions">
                        <button class="btn-check" onclick="checkIn('${m.id}', '${m.name}')">출석 체크</button>
                        <a href="member.html?id=${m.id}" class="btn-detail">상세보기</a>
                    </div>
                `;

                div.addEventListener('dragstart', () => setTimeout(() => div.classList.add('dragging'), 0));
                div.addEventListener('dragend', () => {
                    div.classList.remove('dragging');
                    saveOrder([...document.querySelectorAll('.member-card')].map(c => c.id));
                });
                list.appendChild(div);
            });

            list.addEventListener('dragover', e => {
                e.preventDefault();
                const dragging = document.querySelector('.dragging');
                if (!dragging) return;
                const target = e.target.closest('.member-card');
                if (target && target !== dragging) {
                    const rect = target.getBoundingClientRect();
                    const next = (e.clientY - rect.top) / (rect.bottom - rect.top) > 0.5;
                    window.requestAnimationFrame(() => list.insertBefore(dragging, next ? target.nextSibling : target));
                }
            });
        }

        function toggleFav(id) {
            let favs = getFavs();
            id = String(id);
            favs = favs.includes(id) ? favs.filter(f => f !== id) : [...favs, id];
            saveFavs(favs); applyFilters();
        }

        async function checkIn(id, name) {
            if(!confirm(`${name} 회원님 출석을 완료하시겠습니까?`)) return;
            const bar = document.getElementById('mainProgressBar');
            bar.style.width = "50%";
            try {
                const res = await fetch(`${API}?action=checkin&memberId=${id}`);
                const result = await res.json();
                if(result.result === "success") {
                    const member = allData.find(m => String(m.id) === String(id));
                    if(member) member.pt -= 1;
                    bar.style.width = "100%";
                    setTimeout(() => { applyFilters(); bar.style.width = "0"; }, 300);
                }
            } catch(e) { alert("통신 오류 발생"); bar.style.width = "0"; }
        }

        load();
    </script>
</body>
</html>

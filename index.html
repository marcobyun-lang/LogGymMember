<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <title>PT 회원 관리 시스템</title>
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <script>
        if (sessionStorage.getItem("admin") !== "1") location.href = "admin.html";
    </script>
    <link href="https://fonts.googleapis.com/css2?family=Pretendard:wght@400;600;700&display=swap" rel="stylesheet">
    <style>
        :root { --primary: #4caf50; --bg: #f8f9fa; --danger: #ff5252; }
        body { font-family: 'Pretendard', sans-serif; background: var(--bg); margin: 0; padding: 20px; }
        .container { max-width: 600px; margin: 0 auto; }
        
        /* 네비게이션 및 검색 */
        .nav-buttons { display: flex; gap: 10px; margin-bottom: 20px; }
        .nav-btn { flex: 1; padding: 15px; border-radius: 12px; border: none; background: #fff; font-weight: 600; cursor: pointer; box-shadow: 0 2px 5px rgba(0,0,0,0.05); }
        .search-box { width: 100%; padding: 15px; border: 1px solid #ddd; border-radius: 12px; margin-bottom: 20px; box-sizing: border-box; font-size: 16px; outline: none; }

        /* 로딩 프로그레스 레이어 */
        #loadingLayer { 
            position: fixed; top: 0; left: 0; width: 100%; height: 100%; 
            background: rgba(248, 249, 250, 0.95); z-index: 10000; 
            display: flex; flex-direction: column; justify-content: center; align-items: center; 
        }
        .prog-container { width: 200px; height: 6px; background: #eee; border-radius: 10px; overflow: hidden; margin-top: 15px; }
        .prog-bar { width: 0%; height: 100%; background: var(--primary); transition: width 0.3s ease; }
        .loading-text { font-weight: 600; color: #666; font-size: 0.9em; }

        /* 회원 카드 스타일 */
        .member-card { background: #fff; padding: 20px; border-radius: 16px; margin-bottom: 12px; box-shadow: 0 4px 6px rgba(0,0,0,0.03); }
        .card-top { display: flex; justify-content: space-between; margin-bottom: 10px; align-items: center; }
        .name { font-size: 1.1em; font-weight: 700; }
        .pt-count { font-weight: 700; color: var(--primary); font-size: 0.9em; }
        .pt-count.low { color: var(--danger); }
        
        /* 카드 내 미니 프로그레스 바 */
        .list-prog-container { background: #eee; border-radius: 5px; height: 6px; width: 100%; overflow: hidden; margin-bottom: 15px; }
        .list-prog-bar { background: var(--primary); height: 100%; width: 0%; transition: width 0.5s ease; }

        .actions { display: flex; gap: 8px; justify-content: flex-end; }
        button { padding: 10px 16px; border-radius: 8px; border: none; cursor: pointer; font-weight: 600; font-family: inherit; }
        .btn-check { background: var(--primary); color: white; }
        .btn-detail { background: #f1f1f1; color: #666; }
    </style>
</head>
<body>

<div id="loadingLayer">
    <div class="loading-text">회원 목록을 불러오는 중...</div>
    <div class="prog-container">
        <div id="mainProgressBar" class="prog-bar"></div>
    </div>
</div>

<div class="container" id="mainContent" style="visibility: hidden;">
    <div class="nav-buttons">
        <button class="nav-btn" onclick="location.href='status.html'">📊 잔여 현황</button>
        <button class="nav-btn" onclick="location.href='add.html'">👤 회원 등록</button>
    </div>
    
    <input type="text" id="search" class="search-box" placeholder="이름으로 검색하세요..." oninput="render()">
    
    <div id="memberList"></div>
</div>

<script>
    // 본인의 Google Apps Script 배포 URL
    const API = "https://script.google.com/macros/s/AKfycbw1Skb_N7XGlpKPEt78LBGrGN13jL7m0Npu5Htw-D1pG1knNr58IlubiOBDQe5nsjNN/exec";
    let members = [];

    async function load() {
        const prog = document.getElementById("mainProgressBar");
        try {
            // 로딩 시작
            prog.style.width = "30%";
            
            const res = await fetch(`${API}?action=members`);
            prog.style.width = "70%"; // 데이터 수신 중
            
            const json = await res.json();
            members = json.data || [];
            
            prog.style.width = "100%"; // 로드 완료
            
            // 약간의 지연 후 화면 표시 (부드러운 전환)
            setTimeout(() => {
                document.getElementById("loadingLayer").style.display = "none";
                document.getElementById("mainContent").style.visibility = "visible";
                render();
            }, 400);

        } catch (e) { 
            alert("데이터를 가져오는 데 실패했습니다.");
            console.error(e);
        }
    }

    function render() {
        const list = document.getElementById("memberList");
        const query = document.getElementById("search").value.toLowerCase();
        list.innerHTML = "";

        const filtered = members.filter(m => m.name.toLowerCase().includes(query));
        
        if (filtered.length === 0) {
            list.innerHTML = '<p style="text-align:center; color:#999; padding:40px;">검색 결과가 없습니다.</p>';
            return;
        }

        filtered.forEach(m => {
            const pt = Number(m.pt || 0);
            // 30회 기준으로 게이지 계산 (필요시 수정 가능)
            const per = Math.min((pt / 30) * 100, 100);
            
            const div = document.createElement("div");
            div.className = "member-card";
            div.innerHTML = `
                <div class="card-top">
                    <span class="name">${m.name}</span>
                    <span class="pt-count ${pt <= 3 ? 'low' : ''}">잔여 ${pt}회</span>
                </div>
                <div class="list-prog-container">
                    <div class="list-prog-bar" style="width:${per}%; ${pt <= 3 ? 'background:var(--danger)' : ''}"></div>
                </div>
                <div class="actions">
                    <button class="btn-check" onclick="checkIn('${m.id}', '${m.name}')">출석</button>
                    <button class="btn-detail" onclick="location.href='member.html?id=${m.id}'">상세</button>
                </div>
            `;
            list.appendChild(div);
        });
    }

    async function checkIn(id, name) {
        if(!confirm(`${name}님 출석 체크하시겠습니까? (PT 1회 차감)`)) return;
        
        // 출석 시에도 간단한 피드백을 위해 화면 상단에 로딩 표시를 다시 할 수 있음
        try {
            const res = await fetch(`${API}?action=checkin&memberId=${id}`);
            const result = await res.json();
            if(result.result === "success") { 
                alert("출석 체크가 완료되었습니다."); 
                location.reload(); 
            } else { 
                alert(result.message); 
            }
        } catch(e) {
            alert("연결 오류가 발생했습니다.");
        }
    }

    load();
</script>
</body>
</html>

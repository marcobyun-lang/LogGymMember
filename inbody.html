<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <title>인바디 분석 리포트</title>
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
    <link href="https://fonts.googleapis.com/css2?family=Pretendard:wght@400;600;700&display=swap" rel="stylesheet">
    <style>
        :root { --bg: #0f172a; --card-bg: #1e293b; --primary: #22c55e; --text-main: #f8fafc; --text-sub: #94a3b8; }
        body { font-family: 'Pretendard', sans-serif; background: var(--bg); color: var(--text-main); margin: 0; padding: 20px; }
        .container { max-width: 500px; margin: 0 auto; }
        header { display: flex; align-items: center; gap: 15px; margin-bottom: 25px; }
        .back-btn { background: none; border: none; color: white; font-size: 1.5rem; cursor: pointer; }
        
        .chart-card { background: var(--card-bg); border-radius: 24px; padding: 20px; margin-bottom: 20px; border: 1px solid rgba(255,255,255,0.05); }
        .stat-grid { display: grid; grid-template-columns: 1fr 1fr 1fr; gap: 10px; margin-bottom: 20px; }
        .stat-item { background: rgba(255,255,255,0.03); padding: 15px; border-radius: 16px; text-align: center; }
        .stat-label { font-size: 0.75rem; color: var(--text-sub); display: block; margin-bottom: 5px; }
        .stat-value { font-size: 1rem; font-weight: 700; color: var(--primary); }
        
        .input-group { background: var(--card-bg); border-radius: 24px; padding: 25px; }
        .input-group h4 { margin: 0 0 20px 0; font-size: 1.1rem; }
        input { width: 100%; padding: 14px; margin: 8px 0; border-radius: 12px; border: 1px solid #334155; background: #0f172a; color: white; box-sizing: border-box; font-family: inherit; font-size: 1rem; }
        .save-btn { width: 100%; padding: 16px; border-radius: 12px; border: none; background: var(--primary); color: #000; font-weight: 700; margin-top: 15px; cursor: pointer; font-size: 1rem; }
    </style>
</head>
<body>
    <div class="container">
        <header>
            <button class="back-btn" onclick="history.back()">←</button>
            <h2 style="margin:0">인바디 트렌드</h2>
        </header>

        <div class="chart-card">
            <div class="stat-grid">
                <div class="stat-item"><span class="stat-label">체중</span><span id="currWeight" class="stat-value">-</span></div>
                <div class="stat-item"><span class="stat-label">골격근</span><span id="currMuscle" class="stat-value">-</span></div>
                <div class="stat-item"><span class="stat-label">체지방</span><span id="currFat" class="stat-value">-</span></div>
            </div>
            <div style="position: relative; height:200px; width:100%;">
                <canvas id="inbodyChart"></canvas>
            </div>
        </div>

        <div class="input-group">
            <h4>📏 새 측정 기록</h4>
            <input type="number" id="weight" placeholder="체중 (kg)" step="0.1">
            <input type="number" id="muscle" placeholder="골격근량 (kg)" step="0.1">
            <input type="number" id="fat" placeholder="체지방률 (%)" step="0.1">
            <button class="save-btn" id="saveBtn" onclick="saveInBody()">기록 저장하기</button>
        </div>
    </div>

    <script>
        const API = "https://script.google.com/macros/s/AKfycbwUU5njs_p4VY0gVVLw2b1ISQp9tSX_0AlQPz9FkQAqn73hMqEDQcAfvmP20lCUw6k9/exec";
        const urlParams = new URLSearchParams(window.location.search);
        const memberId = urlParams.get('id');

        async function loadInBody() {
            try {
                const res = await fetch(`${API}?action=getInBody&memberId=${memberId}`);
                const result = await res.json();
                if(result.result === "success") {
                    if(result.data.length > 0) {
                        const last = result.data[result.data.length - 1];
                        document.getElementById('currWeight').innerText = last.weight + 'kg';
                        document.getElementById('currMuscle').innerText = last.muscle + 'kg';
                        document.getElementById('currFat').innerText = last.fat + '%';
                        renderChart(result.data);
                    }
                }
            } catch(e) { console.error(e); }
        }

        function renderChart(data) {
            const ctx = document.getElementById('inbodyChart').getContext('2d');
            new Chart(ctx, {
                type: 'line',
                data: {
                    labels: data.map(d => d.date.split('-').slice(1).join('/')),
                    datasets: [
                        { label: '체중', data: data.map(d => d.weight), borderColor: '#3b82f6', tension: 0.3, pointRadius: 4 },
                        { label: '골격근', data: data.map(d => d.muscle), borderColor: '#22c55e', tension: 0.3, pointRadius: 4 },
                        { label: '체지방', data: data.map(d => d.fat), borderColor: '#ef4444', tension: 0.3, pointRadius: 4 }
                    ]
                },
                options: { 
                    responsive: true,
                    maintainAspectRatio: false,
                    plugins: { legend: { display: true, labels: { color: '#94a3b8', boxWidth: 10, font: { size: 10 } } } },
                    scales: { 
                        y: { ticks: { color: '#64748b', font: { size: 10 } }, grid: { color: 'rgba(255,255,255,0.05)' } },
                        x: { ticks: { color: '#64748b', font: { size: 10 } }, grid: { display: false } }
                    }
                }
            });
        }

        async function saveInBody() {
            const w = document.getElementById('weight').value;
            const m = document.getElementById('muscle').value;
            const f = document.getElementById('fat').value;
            if(!w || !m || !f) { alert("모든 수치를 입력해주세요."); return; }

            const btn = document.getElementById('saveBtn');
            btn.disabled = true; btn.innerText = "저장 중...";

            const payload = { action: "addInBody", memberId, weight: w, muscle: m, fat: f };
            try {
                const res = await fetch(API, { method: 'POST', body: JSON.stringify(payload) });
                const result = await res.json();
                if(result.result === "success") {
                    alert("성공적으로 저장되었습니다.");
                    location.reload();
                }
            } catch(e) { alert("오류 발생"); btn.disabled = false; btn.innerText = "기록 저장하기"; }
        }
        loadInBody();
    </script>
</body>
</html>
